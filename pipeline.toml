# pipeline.toml — Karaoke Pipeline Configuration
# Zero-cloud. All processing runs locally on the ROG Flow Z13.
#
# Hardware profile selection:
#   "auto"     — hw_detect.py probes DirectML + AMF at startup (recommended)
#   "z13"      — force Z13 defaults without probing (faster startup)
#   "cpu_only" — disable all GPU paths (safe fallback, slower)

[general]
jobs_dir  = "jobs"
log_level = "INFO"   # DEBUG | INFO | WARNING | ERROR

[server]
host = "0.0.0.0"
port = 5000
secret_key = "karaoke-local-dev"
max_upload_mb = 512

[ui]
default_style_preset = "single-style-kf"

[hardware]
profile = "auto"

# Z13 defaults — used when profile = "z13", or as reference for "auto".
# hw_detect.py may override any of these based on runtime probe results.
[hardware.z13]

# Stage 02 · Demucs
# PyTorch supports DirectML via torch-directml.
# segment=4 keeps peak shared VRAM at ~1.2GB (vs ~2.4GB at default 7.8s).
demix_device   = "directml"
demix_compute  = "float16"
demix_segment  = 4
demix_jobs     = 1

# Stage 03 · faster-whisper (CTranslate2)
# IMPORTANT: CTranslate2 has NO DirectML backend.
# Setting device to anything other than "cpu" causes a RuntimeError on load.
# int8 gives ~4x CPU speedup with negligible WER impact for karaoke.
transcribe_device    = "cpu"
transcribe_compute   = "int8"
transcribe_beam_size = 1
transcribe_vad       = false

# Stage 04 · HubertFA
# PyTorch — DirectML supported.
align_device     = "directml"
align_batch_size = 8

# Stage 05 · Gemma 4 via Ollama
# Ollama manages its own GPU allocation — do not override device here.
ollama_model      = "gemma4:27b"
ollama_num_ctx    = 4096
ollama_num_thread = 6      # leaves 2 cores for OS + Ollama GPU scheduler
ollama_temperature = 0.3

# Stage 07 · ffmpeg
# h264_amf = AMD hardware encoder (~3x faster than libx264 on Z13).
# Falls back to libx264 if AMF not available in the ffmpeg build.
ffmpeg_vcodec  = "h264_amf"
ffmpeg_quality = 23        # 0-51; 23 ≈ libx264 crf=23 (visually transparent)

# CPU-only fallback profile — all GPU paths disabled.
[hardware.cpu_only]
demix_device         = "cpu"
demix_compute        = "float32"
demix_segment        = 8
demix_jobs           = 2
transcribe_device    = "cpu"
transcribe_compute   = "int8"
transcribe_beam_size = 1
transcribe_vad       = false
align_device         = "cpu"
align_batch_size     = 8
ollama_model         = "gemma4:27b"
ollama_num_ctx       = 2048
ollama_num_thread    = 8
ollama_temperature   = 0.3
ffmpeg_vcodec        = "libx264"
ffmpeg_quality       = 23


# ── Pipeline stage configs ─────────────────────────────────────────────────

[demix]
model = "htdemucs"
timeout_s = 1800
# Path to the Python executable in demucs_env.
# Demucs runs in its own conda env to isolate its heavy dependencies.
python = "C:/Users/Katz/miniforge3/envs/demucs_env/python.exe"

[transcribe]
mode            = "auto"     # "auto" | "whisper" | "forced"
                             # "auto": uses forced alignment if lyrics.txt exists,
                             #         falls back to Whisper otherwise
model_size      = "large-v3"
language        = "auto"     # Whisper language code: "auto" | "en" | "ja" | "pt"
forced_language = "eng"      # ISO-639-3 for MMS forced aligner: eng | jpn | por | zho
low_confidence_threshold = 0.25

[align]
hubertfa_dir = "vendor/HubertFA"
checkpoint   = "models/hubertfa/model.onnx"
language     = "en"
hubertfa_timeout_s = 600
# HubertFA produces the per-phoneme timing that s05 turns into syllables.
# It is skipped when ONNX only exposes CPUExecutionProvider (no GPU/DirectML),
# which yields phonemes:[] and word-level highlight only. Set true to run it on
# CPU anyway (slower, ~40s per song). Prefer installing onnxruntime-directml on
# the AMD box so an accelerated provider is available and this can stay false.
allow_cpu_hubertfa = true
# CTC forced-alignment can produce small overlaps (~20–50 ms) at phrase
# boundaries. Tolerating up to 50 ms avoids hard-failing valid jobs.
overlap_tolerance_s = 0.05
# Minimum word duration (ms). CTC compresses short function words to ~0, which
# yields degenerate syllables and pollutes the syllable review queue. s04 lifts
# any sub-floor word to this duration, borrowing time from longer words in the
# same contiguous run so the line envelope (line-sync) is preserved.
min_word_ms = 120

[analyze]
ollama_url   = "http://localhost:11434"
language     = "en"
temperature  = 0.3
timeout_s    = 600
# ollama_model and num_ctx come from [hardware.*] — not duplicated here.
max_tokens   = 4096

[render]
# Which renderer produces the final video:
#   "ass" — s06_generate_ass + s07_output (ffmpeg/libass). Default, fast, robust.
#   "gpu" — s06b_render_gpu (Remotion + three.js): per-glyph shader dissolve,
#           ember frontier, audio-reactive bloom, spark bursts. Much higher motion
#           ceiling; slower (a Chromium+ffmpeg headless render, minutes per song).
engine = "ass"

[render_gpu]
# GPU renderer must run from a SHORT, non-OneDrive path (MAX_PATH + OneDrive
# dehydration break native .exe spawns). The app is staged here and rendered.
work_dir = "C:/rk"
# Optional: point at an existing chrome-headless-shell.exe if Remotion's own
# download lands ENOENT (e.g. antivirus). Leave blank to use Remotion's.
browser_executable = ""
timeout_s = 3600
# Parallel frame renderers. THE wall-clock lever (rendering, not encoding, is the
# bottleneck). 0 = Remotion auto (~cores/2). Raise toward physical cores; each tab
# costs RAM/VRAM, so back off if the box swaps. Z13: try 4–6.
concurrency = 0
# Remotion h264 CRF (lower=better, ~18 default). Leave unset for Remotion's default.
# crf = 18
# Final re-encode with the system ffmpeg hardware encoder, matching s07. This is a
# consistency/size pass, NOT a speedup (it adds one encode). AMF ignores CRF → CQP.
amf_encode = false
amf_vcodec = "h264_amf"   # or "libx264" (CRF) / "hevc_amf"
amf_quality = 23          # CQP 0-51, lower=better
# Mix the vocal stem back into the soundtrack (guide vocal) to verify sync. The
# normal karaoke output uses the instrumental only (false).
include_vocals = false
vocal_gain = 1.0          # gain on the mixed-in vocal stem

[generate]
style_preset = "single-style-kf"
resolution   = "1920x1080"
fade_in_ms   = 300
fade_out_ms  = 500

[syllables]
# Per-syllable karaoke highlight timing derived from s04 phonemes (s05).
split_enabled       = true   # false → one highlight per word (no syllable split)
uncertain_threshold = 0.6    # syllable confidence below this opens a syllable_uncertain issue
min_segment_ms      = 80      # floor per syllable segment (coherent with MIN_WORD_MS)

[output]
audio_codec    = "aac"
audio_bitrate  = "192k"
vocals_volume  = 1.0
instrumental_volume = 1.0
framerate      = "30"
ffmpeg_timeout_s = 600
# video codec and quality come from [hardware.*]
