<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Karaoke Pipeline{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="grid-bg"></div>
  <header class="site-header">
    <a href="/" class="logo">
      <span class="logo-bracket">[</span>
      <span class="logo-text">KARAOKE</span>
      <span class="logo-dot">•</span>
      <span class="logo-sub">PIPELINE</span>
      <span class="logo-bracket">]</span>
    </a>
    <nav class="site-nav">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">COCKPIT</a>
      <a href="/job/new" class="nav-link nav-cta">+ NEW JOB</a>
    </nav>
  </header>
  <main class="site-main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <span class="mono dim">KARAOKE PIPELINE // LOCAL BUILD // Z13</span>
  </footer>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
